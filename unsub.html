<script>
// 링크: unsub.html?utm_source=email&utm_medium=coach_stage&utm_campaign=pro_coach_unsub&utm_content=<불투명 토큰>

(function(){
  var q=new URLSearchParams(location.search), t=(q.get('utm_content')||'').trim();

  if(!/^[A-Za-z0-9]{8,32}$/.test(t)){ h.textContent='링크를 확인할 수 없습니다'; p.textContent='이 메일에 그대로 회신해 주시면 수신거부를 처리해 드리겠습니다.'; b.style.display='none'; return; }
  b.onclick=function(){
    b.disabled=true; b.textContent='처리 중…';
    try{ gtag('event','unsubscribe_click',{utm_source:q.get('utm_source')||'email',utm_medium:q.get('utm_medium')||'coach_stage',utm_campaign:q.get('utm_campaign')||'pro_coach_unsub',utm_content:t}); }catch(e){}
    // n8n 접수 웹훅에는 토큰만 넘긴다(mall·uid 칸에 같은 토큰) — 어느 몰인지는 내부에서 토큰으로 푼다

    var done=false;
    function ok(){ if(done) return; done=true; h.textContent='수신거부가 처리되었습니다'; p.textContent='앞으로 이 쇼핑몰로는 안내 메일을 보내지 않습니다. 불편을 드려 죄송합니다.'; b.style.display='none'; }
    var i=new Image(); i.onload=i.onerror=ok; i.src=u;   // GET 한 번이면 끝 — 응답 본문은 읽지 않는다
    setTimeout(ok,4000);
  };
})();
</script></body></html>
